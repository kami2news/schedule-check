name: schedule_check
description: バイト・授業・締切をまとめて確認するスケジュール確認アプリ
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Material の部品（Flutter 本体から分離された公式パッケージ）
  material_ui: ^1.11.0
  # Microsoft 公式の Fluent System Icons
  fluentui_system_icons: ^1.1.270
  shared_preferences: ^2.2.3
  # オンライン同期とアカウント（Firebase）
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  url_launcher: ^6.3.0
  # ブラウザの通知（Notification API）
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # KM1 の書体 Noto Sans JP（SIL OFL 1.1, assets/fonts/OFL-NotoSansJP.txt）。
    # 英数字・記号だけを切り出して同梱（各 84KB）。日本語の字形は Web では Flutter が
    # Noto Sans JP を自動で読み込み、アプリでは各 OS の日本語フォントに任せる。
    # 名前を「Noto Sans JP」にすると、Web で日本語の自動読み込みが働かず文字化けするので別名にする
    - family: KM1 Latin
      fonts:
        - asset: assets/fonts/NotoSansJP-Latin-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Latin-600.ttf
          weight: 600
    # KM1 のアイコン（KM1-ICO-001。lib/km1/km1_icons.dart。形は Fluent System Icons, MIT）
    - family: KM1Icons
      fonts:
        - asset: assets/fonts/KM1Icons.ttf
