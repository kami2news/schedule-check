name: schedule_check
description: バイト・授業・締切をまとめて確認するスケジュール確認アプリ
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Microsoft 公式の Fluent System Icons
  fluentui_system_icons: ^1.1.270
  shared_preferences: ^2.2.3
  # オンライン同期とアカウント（Firebase）
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  url_launcher: ^6.3.0
  # ブラウザの通知（Notification API）
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # Segoe UI 互換のオープンフォント Selawik (SIL OFL 1.1, assets/fonts/OFL-Selawik.txt)
    - family: Selawik
      fonts:
        - asset: assets/fonts/Selawik-Light.ttf
          weight: 300
        - asset: assets/fonts/Selawik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Selawik-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Selawik-Bold.ttf
          weight: 700
