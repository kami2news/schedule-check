name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --base-href /schedule-check/ --dart-define=BUILD_ID=${GITHUB_SHA::7}

      # 更新がすぐ反映されるよう、読み込むファイルにビルドごとの ?v= を付ける（ブラウザのキャッシュ対策）
      - name: Cache-bust entry files
        run: |
          V=${GITHUB_SHA::7}
          sed -i "s/main\.dart\.js\"/main.dart.js?v=$V\"/g" build/web/flutter_bootstrap.js
          sed -i "s/src=\"flutter_bootstrap\.js\"/src=\"flutter_bootstrap.js?v=$V\"/" build/web/index.html
          grep -c "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          grep "flutter_bootstrap.js?v=$V" build/web/index.html

      # ビルド結果を preview-build ブランチにも置く（見た目の確認用）
      - name: Publish build to preview-build branch
        # 確認用なので、失敗しても公開は止めない
        continue-on-error: true
        run: |
          cd build/web
          git init -q -b preview-build
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
